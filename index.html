<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>동준 ♥ 혜인</title>
<style>
:root{--blue:#5aa9ff;--pink:#ff7eb3;--ink:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:#000;overflow:hidden;font-family:"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.slide.on{opacity:1}
.slide img.bg{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(28px) brightness(.7)}
.slide img.fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.02);transition:transform 8s ease-out}
.slide.on img.fg{transform:scale(1)}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 55%,rgba(0,0,0,.78) 100%)}
/* 호감도 */
.hud{position:fixed;top:2.2vh;left:3vw;right:3vw;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.meter{width:30vw;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:999px;padding:.9vh 1.2vw;display:flex;align-items:center;gap:.8vw;border:1.5px solid rgba(255,255,255,.35)}
.meter .who{font-weight:800;font-size:2.1vh;white-space:nowrap}
.bar{flex:1;height:1.6vh;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
.m-d .fill{background:linear-gradient(90deg,#9fd0ff,var(--blue))}
.m-h .fill{background:linear-gradient(90deg,#ffc2dc,var(--pink))}
.num{font-weight:900;font-size:2.6vh;min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums}
.m-d .num{color:#bfe0ff}.m-h .num{color:#ffd0e3}
.pop{position:absolute;top:5.2vh;font-weight:900;font-size:2.4vh;opacity:0}
.pop.go{animation:pop 1.4s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.m-d{position:relative}.m-h{position:relative}
.m-d .pop{left:1.2vw;color:#bfe0ff}.m-h .pop{right:1.2vw;color:#ffd0e3}
/* 아래 글 */
.cap{position:absolute;left:4vw;right:4vw;bottom:4vh}
.tag{display:inline-block;font-size:1.9vh;font-weight:800;letter-spacing:.05em;background:rgba(255,255,255,.18);padding:.4vh .9vw;border-radius:6px;margin-bottom:1.2vh}
.line{font-size:3.4vh;font-weight:800;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.6);margin-bottom:1.6vh}
.minds{display:flex;gap:1.4vw}.minds.flip{flex-direction:row-reverse}
.mind{flex:1;min-width:0;border-radius:14px;padding:1.2vh 1.2vw;font-size:2.4vh;line-height:1.4;font-weight:600;backdrop-filter:blur(8px)}
.mind b{display:block;font-size:1.7vh;opacity:.85;margin-bottom:.3vh}
.mind.d{background:rgba(70,140,230,.45);border:1.5px solid rgba(160,205,255,.6)}
.mind.h{background:rgba(235,90,150,.42);border:1.5px solid rgba(255,180,210,.6)}
.mind:empty{display:none}
/* 표지·끝 */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.35)}
.title h1{font-size:9vh;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.title p{font-size:3vh;margin-top:2vh;font-weight:700}
.letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,30,.45)}
.lcard{max-width:68vw;background:rgba(255,250,245,.92);color:#3a2a33;border-radius:22px;padding:5vh 4vw;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.lto{font-size:3.6vh;font-weight:900;margin-bottom:3vh;color:#c2457a}
.ltext{font-size:2.9vh;line-height:1.8;font-weight:600}
.lfrom{margin-top:3vh;font-size:2.4vh;font-weight:800;color:#6b5560}
@media (max-aspect-ratio:4/3){.minds{flex-direction:column;gap:1vh}.minds.flip{flex-direction:column-reverse;gap:1vh}.line{font-size:3vh}}
.page{position:fixed;right:1.2vw;bottom:1vh;font-size:1.4vh;opacity:.45;z-index:10}

@media (max-height:520px), (max-width:600px){
 .hud{top:8px;left:8px;right:8px}
 .meter{padding:4px 8px;gap:6px}
 .meter .who{font-size:11px}.num{font-size:13px;min-width:2.6em}.bar{height:6px}
 .pop{display:none}
 .cap{left:10px;right:10px;bottom:10px}
 .tag{font-size:11px;padding:2px 6px;margin-bottom:4px}
 .line{font-size:15px;margin-bottom:6px}
 .mind{font-size:13px;padding:6px 8px;border-radius:10px}.mind b{font-size:10px}
 .lcard{padding:16px 14px;max-width:92vw}.lto{font-size:17px;margin-bottom:10px}.ltext{font-size:13px;line-height:1.6}.lfrom{font-size:12px;margin-top:10px}
 .title h1{font-size:34px}.title p{font-size:15px}
}
@media (max-width:600px){ .meter{width:46vw} .bar{display:none} }

 {letter:true, img:"l-인사", from:"동준", to:"혜인이 부모님께", text:"아버님, 어머님.<br><br>혜인이를 이렇게 밝고 사랑스럽게 키워 주셔서 감사합니다.<br><br>제가 아는 혜인이는 너무너무 착하지만,<br>중요한 순간에는 누구보다 현명하게 판단하는 사람입니다.<br><br>혜인이를 볼 때마다 그 모든 게 두 분께 받은 것이라는 게 느껴져서,<br>두 분이 지금까지 지켜 주신 혜인이의 웃음을<br>이제 제가 더 지켜 가려고 합니다.<br><br>감사합니다. 행복하게 잘 살겠습니다.", dv:999, hv:999},
 {letter:true, img:"l-인사", from:"동준", to:"엄마, 아빠한테", text:"엄마, 아빠.<br><br>어릴 때 해외 다니면서 이것저것 경험시켜 준 덕분에<br>시야가 많이 트였고, 더 넓은 세상이 있다는 걸 배웠어.<br><br>「거짓말은 나쁜 거다」<br>그리고 엄마가 행동으로 보여 준 모습에서 책임감을 배웠어.<br><br>내가 받은 걸 우리 아이한테도 다시 줄 수 있는,<br>멋진 부모가 되어 볼게. 고마워.", dv:999, hv:999},
 {letter:true, img:"l-인사", from:"혜인", to:"엄마, 아빠한테", text:"엄마, 아빠.<br><br>아빠, 정해진 틀보다 내가 하고 싶은 걸 찾아서<br>마음껏 펼치라고 늘 말해 주고 밀어 줘서 고마워.<br><br>엄마, 늘 우리 집 중심을 잡아 주고<br>든든한 내 편이 있다는 걸 알게 해 줘서<br>내가 이만큼 잘 클 수 있었어.<br><br>사랑해. 우리 잘 살게.", dv:999, hv:999},

 {title:true, img:"22", head:"예쁘게 봐 주세요!", sub:"동준 ♥ 혜인", dv:999, hv:999},

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML = `<img class="bg" src="그림/${s.img}.jpg"><img class="fg" src="그림/${s.img}.jpg"><div class="shade"></div>` + (s.letter
    ? `<div class="letter"><div class="lcard"><div class="lto">${s.to}</div><div class="ltext">${s.text}</div><div class="lfrom">— ${s.from}</div></div></div>`
    : s.title
    ? `<div class="title"><h1>${s.head}</h1><p>${s.sub}</p></div>`
    : `<div class="cap"><span class="tag">${s.tag}</span><div class="line">${s.line}</div><div class="minds${s.flip?' flip':''}"><div class="mind d">${s.d?`<b>💙 동준 속마음</b>${s.d}`:''}</div><div class="mind h">${s.h?`<b>💗 혜인 속마음</b>${s.h}`:''}</div></div></div>`);
  stage.appendChild(el);
});
const slides=[...stage.children]; let cur=-1, shownD=0, shownH=0;
const show=v=>v>=999?'∞':String(v);
function count(el,from,to){ if(to>=999){el.textContent='∞';return}
  const t0=performance.now(), dur=1000; const step=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);}
function pop(el,diff){ if(!diff||diff>500||diff<-500){return} el.textContent=(diff>0?'+':'')+diff; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
function go(n){
  n=Math.max(0,Math.min(slides.length-1,n)); if(n===cur)return;
  slides.forEach((s,i)=>s.classList.toggle('on',i===n)); cur=n; const s=S[n];
  const pct=v=>v>=999?100:Math.min(100,v);
  document.getElementById('fd').style.width=pct(s.dv)+'%'; document.getElementById('fh').style.width=pct(s.hv)+'%';
  count(document.getElementById('nd'),Math.min(shownD,998),s.dv); count(document.getElementById('nh'),Math.min(shownH,998),s.hv);
  pop(document.getElementById('pd'),s.dv-shownD); pop(document.getElementById('ph'),s.hv-shownH);
  shownD=s.dv; shownH=s.hv;
  document.getElementById('hud').style.opacity = (n===0 || s.letter) ? 0 : 1;
  document.getElementById('page').textContent=(n+1)+' / '+slides.length;
  if(typeof music==='function') music(n);
}
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
let tx=null,ty=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{ if(tx===null) return; const x=e.changedTouches[0].clientX, dx=x-tx, dy=e.changedTouches[0].clientY-ty;
  if(!started){started=true; music(cur);}
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)) go(dx<0?cur+1:cur-1); else go(x<innerWidth*0.3?cur-1:cur+1); tx=null; e.preventDefault(); },{passive:false});
addEventListener('click',e=>{ go(e.clientX<innerWidth*0.3?cur-1:cur+1); });

// ── 배경음악 ──
// 구간: ① 썸(첫 만남 ~ 맛잘알 의심) · ② 확신·고백(카페 ~ 청라) · ③ 감사(결혼식 ~ 끝)
// 인터넷이 되면 유튜브 피아노 버전, 안 되면 음악 폴더의 연주곡. 첫 키를 누르면 시작. M = 끄기/켜기, + / - = 크기.
const SECTIONS=[
 {name:"① 썸 — 소유×정기고 「썸」 피아노", yt:"Auo7hpIy8tI", at:0, file:"음악/1-설렘.mp3"},
 {name:"② 확신·고백 — 폴킴 「모든 날, 모든 순간」 피아노", yt:"sjiydBdJaE0", at:0, file:"음악/2-진지.mp3"},
 {name:"③ 감사 — 성시경 「두 사람」 피아노", yt:"FsoXypqRTig", at:0, file:"음악/3-감사.mp3"},
];
const part2=S.findIndex(x=>x.img==="12b"), part3=S.findIndex((x,i)=>i>0&&x.img==="21"&&!x.title);
const trackFor=n=>n>=part3?2:(n>=part2?1:0);
let vol=0.22, muted=false, started=false, curTrack=-1, yt=null, ytOk=false, useYT=false;
const files=SECTIONS.map(x=>{const a=new Audio(x.file);a.loop=true;a.volume=0;return a});
window.onYouTubeIframeAPIReady=()=>{ yt=new YT.Player('ytbox',{height:'1',width:'1',playerVars:{autoplay:0,controls:0,playsinline:1},
  events:{onReady:()=>{ytOk=true}, onError:()=>{ if(useYT){useYT=false; const t=curTrack; curTrack=-1; music(cur,true);} },
          onStateChange:e=>{ if(e.data===0&&useYT) yt.seekTo(SECTIONS[curTrack].at||0) }}}) };
function ramp(set,from,to,ms,done){const t0=performance.now();const st=t=>{const k=Math.min(1,(t-t0)/ms);set(from+(to-from)*k);if(k<1)requestAnimationFrame(st);else if(done)done()};requestAnimationFrame(st)}
function music(n,force){ if(!started) return; const t=trackFor(n); if(t===curTrack&&!force) return;
  const target=muted?0:vol;
  if(curTrack>=0){ const old=files[curTrack]; ramp(v=>old.volume=Math.max(0,v),old.volume,0,1200,()=>old.pause()); }
  curTrack=t;
  useYT = false; // 핸드폰은 화면을 누르는 순간에 바로 틀어야 소리가 나요 — 유튜브는 한 박자 늦게 틀어서 아이폰이 막아요
  if(useYT){ const sec=SECTIONS[t]; const startV=yt.getVolume?yt.getVolume():0;
    ramp(v=>yt.setVolume(v),startV,0,800,()=>{ yt.loadVideoById({videoId:sec.yt,startSeconds:sec.at||0}); yt.setVolume(0); ramp(v=>yt.setVolume(v),0,target*100,2000); }); }
  else { if(yt&&ytOk) yt.stopVideo(); const a=files[t]; a.currentTime=0; a.play().catch(()=>{}); ramp(v=>a.volume=Math.min(1,Math.max(0,v)),0,target,2000); }
  const tip=document.getElementById('songtip'); tip.textContent='♪ '+SECTIONS[t].name+(useYT?'':' (연주곡)'); tip.style.opacity=1; setTimeout(()=>tip.style.opacity=0,3500);
}
function applyVol(){ const v=muted?0:vol; if(useYT&&yt) yt.setVolume(v*100); else if(curTrack>=0) files[curTrack].volume=v; }
addEventListener('keydown',e=>{
  if(!started){started=true; music(cur);}
  if(e.key==='m'||e.key==='M'){muted=!muted; applyVol();}
  if(e.key==='+'||e.key==='='){vol=Math.min(0.7,vol+0.05); applyVol();}
  if(e.key==='-'){vol=Math.max(0,vol-0.05); applyVol();}
});
addEventListener('click',()=>{ if(!started){started=true; music(cur);} });
go(0);
</script>
